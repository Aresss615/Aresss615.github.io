            - heading "J&J Grocery POS" [level=3] [ref=e86]
            - paragraph [ref=e87]: A complete point-of-sale and inventory system running the day-to-day of a real Philippine grocery store.
            - generic [ref=e88]:
              - generic [ref=e89]:
                - generic [ref=e90]: Problem
                - paragraph [ref=e91]: The store ran sales and stock by hand — slow checkout, no audit trail, and no reliable view of what was selling or what was left on the shelf.
              - generic [ref=e92]:
                - generic [ref=e93]: Approach
                - paragraph [ref=e94]:
                  - text: Vanilla PHP + MySQL, no framework — so it deploys on any cheap PHP host the store can actually afford. Barcode checkout auto-decrements stock; every sale, void, and refund posts to a
                  - strong [ref=e95]: double-entry accounting journal
                  - text: and an immutable audit trail. Receipts follow BIR formatting with 12% VAT and cash, GCash, and card tender.
              - generic [ref=e96]:
                - generic [ref=e97]: Engineering depth
                - paragraph [ref=e98]:
                  - text: Refunds use
                  - strong [ref=e99]: optimistic locking
                  - text: so double-refunds are impossible. Access is
                  - strong [ref=e100]: permission-based
                  - text: across four roles. CSRF protection on every write, session timeout, and Z-Read day-close. The schema has evolved across
                  - strong [ref=e101]: nine migrations
                  - text: as the store's needs grew, with PHPUnit tests on the core flows.
