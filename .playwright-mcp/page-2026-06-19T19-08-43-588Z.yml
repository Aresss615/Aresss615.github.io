            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e165]
            - paragraph [ref=e166]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e167]:
              - generic [ref=e168]:
                - generic [ref=e169]: Problem
                - paragraph [ref=e170]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e171]:
                - generic [ref=e172]: Approach
                - paragraph [ref=e173]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
              - generic [ref=e174]:
                - generic [ref=e175]: Engineering depth
                - paragraph [ref=e176]:
