            - paragraph [ref=e311]: An open-source TikTok / Shorts generator I forked and extended — turning a script into a finished, captioned vertical video, end to end.
            - generic [ref=e312]:
              - generic [ref=e313]:
                - generic [ref=e314]: Problem
                - paragraph [ref=e315]: The base project picked stock clips at random and leaned on a paid cloud voice. Captions were block-timed, so words never lit up in sync with the narration — the videos felt generic and the costs didn't scale.
              - generic [ref=e316]:
                - generic [ref=e317]: Approach
                - paragraph [ref=e318]:
                  - text: I forked
                  - strong [ref=e319]: MoneyPrinterTurbo
                  - text: and rebuilt three subsystems.
                  - strong [ref=e320]: Semantic clip matching
                  - text: embeds the script and ranks stock footage by meaning instead of random selection. Local
                  - strong [ref=e321]: Chatterbox TTS
                  - text: with voice cloning replaces paid Azure — no API cost, no rate limits. And captions highlight
                  - strong [ref=e322]: word-by-word
                  - text: ", lighting each word exactly as it's spoken."
              - generic [ref=e323]:
                - generic [ref=e324]: Engineering depth
                - paragraph [ref=e325]:
                  - text: Word-level highlighting is driven by
                  - strong [ref=e326]: WhisperX
                  - text: forced-alignment against the TTS audio, so subtitles track real word boundaries across wrapped, multi-line text. The render path runs on MoviePy with automatic CPU fallback when CUDA is unavailable — built to run on whatever machine is in front of you.
