            - heading "J&J Grocery POS" [level=3] [ref=e160]
            - paragraph [ref=e161]: A complete point-of-sale and inventory system running the day-to-day of a real Philippine grocery store.
            - generic [ref=e162]:
              - generic [ref=e163]:
                - generic [ref=e164]: Problem
                - paragraph [ref=e165]: The store ran sales and stock by hand — slow checkout, no audit trail, and no reliable view of what was selling or what was left on the shelf.
              - generic [ref=e166]:
                - generic [ref=e167]: Approach
                - paragraph [ref=e168]:
                  - text: Vanilla PHP + MySQL, no framework — so it deploys on any cheap PHP host the store can actually afford. Barcode checkout auto-decrements stock; every sale, void, and refund posts to a
                  - strong [ref=e169]: double-entry accounting journal
                  - text: and an immutable audit trail. Receipts follow BIR formatting with 12% VAT and cash, GCash, and card tender.
              - generic [ref=e170]:
                - generic [ref=e171]: Engineering depth
                - paragraph [ref=e172]:
                  - text: Refunds use
                  - strong [ref=e173]: optimistic locking
                  - text: so double-refunds are impossible. Access is
                  - strong [ref=e174]: permission-based
                  - text: across four roles. CSRF protection on every write, session timeout, and Z-Read day-close. The schema has evolved across
                  - strong [ref=e175]: nine migrations
                  - text: as the store's needs grew, with PHPUnit tests on the core flows.
