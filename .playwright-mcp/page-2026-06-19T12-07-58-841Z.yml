            - paragraph [ref=e216]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e217]:
              - generic [ref=e218]:
                - generic [ref=e219]: Problem
                - paragraph [ref=e220]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e221]:
                - generic [ref=e222]: Approach
                - paragraph [ref=e223]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
