      - generic [ref=e112]:
        - generic [ref=e113]: 02 / Selected Work
        - heading "Systems I designed, built, and still maintain." [level=2] [ref=e114]:
          - text: Systems I designed,
          - text: built, and still maintain.
        - paragraph [ref=e115]: Two are sole-engineer builds; one is an open-source pipeline I forked and extended. Every one solves a real problem for real users — no class assignments dressed up as products.
      - generic [ref=e116]:
        - article [ref=e117]:
