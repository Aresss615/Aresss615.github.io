            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e201]
            - paragraph [ref=e202]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e203]:
              - generic [ref=e204]:
                - generic [ref=e205]: Problem
                - paragraph [ref=e206]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e207]:
                - generic [ref=e208]: Approach
                - paragraph [ref=e209]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
              - generic [ref=e210]:
                - generic [ref=e211]: Engineering depth
                - paragraph [ref=e212]:
                  - text: Overbooking is prevented at the database level — bookings commit inside a transaction using
                  - strong [ref=e213]: SELECT … FOR UPDATE
                  - text: ", so two customers can't grab the same slot. bcrypt + HttpOnly session cookies, role-based access, and KPI reporting."
