            - paragraph [ref=e218]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e219]:
              - generic [ref=e220]:
                - generic [ref=e221]: Problem
                - paragraph [ref=e222]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e223]:
                - generic [ref=e224]: Approach
                - paragraph [ref=e225]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
