            - heading "MoneyPrinterTurbo — Extended" [level=3] [ref=e287]
            - paragraph [ref=e288]: An open-source TikTok / Shorts generator I forked and extended — turning a script into a finished, captioned vertical video, end to end.
            - generic [ref=e289]:
              - generic [ref=e290]:
                - generic [ref=e291]: Problem
                - paragraph [ref=e292]: The base project picked stock clips at random and leaned on a paid cloud voice. Captions were block-timed, so words never lit up in sync with the narration — the videos felt generic and the costs didn't scale.
              - generic [ref=e293]:
                - generic [ref=e294]: Approach
                - paragraph [ref=e295]:
                  - text: I forked
                  - strong [ref=e296]: MoneyPrinterTurbo
                  - text: and rebuilt three subsystems.
                  - strong [ref=e297]: Semantic clip matching
                  - text: embeds the script and ranks stock footage by meaning instead of random selection. Local
                  - strong [ref=e298]: Chatterbox TTS
                  - text: with voice cloning replaces paid Azure — no API cost, no rate limits. And captions highlight
                  - strong [ref=e299]: word-by-word
                  - text: ", lighting each word exactly as it's spoken."
              - generic [ref=e300]:
                - generic [ref=e301]: Engineering depth
                - paragraph [ref=e302]:
                  - text: Word-level highlighting is driven by
                  - strong [ref=e303]: WhisperX
                  - text: forced-alignment against the TTS audio, so subtitles track real word boundaries across wrapped, multi-line text. The render path runs on MoviePy with automatic CPU fallback when CUDA is unavailable — built to run on whatever machine is in front of you.
