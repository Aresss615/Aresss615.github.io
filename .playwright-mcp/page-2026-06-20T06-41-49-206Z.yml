            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e216]
            - paragraph [ref=e217]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e218]:
              - generic [ref=e219]:
                - generic [ref=e220]: Problem
                - paragraph [ref=e221]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e222]:
                - generic [ref=e223]: Approach
                - paragraph [ref=e224]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
              - generic [ref=e225]:
                - generic [ref=e226]: Engineering depth
                - paragraph [ref=e227]:
