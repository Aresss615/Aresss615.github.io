            - heading "J&J Grocery POS" [level=3] [ref=e137]
            - paragraph [ref=e138]: A complete point-of-sale and inventory system running the day-to-day of a real Philippine grocery store.
            - generic [ref=e139]:
              - generic [ref=e140]:
                - generic [ref=e141]: Problem
                - paragraph [ref=e142]: The store ran sales and stock by hand — slow checkout, no audit trail, and no reliable view of what was selling or what was left on the shelf.
              - generic [ref=e143]:
                - generic [ref=e144]: Approach
                - paragraph [ref=e145]:
                  - text: Vanilla PHP + MySQL, no framework — so it deploys on any cheap PHP host the store can actually afford. Barcode checkout auto-decrements stock; every sale, void, and refund posts to a
                  - strong [ref=e146]: double-entry accounting journal
                  - text: and an immutable audit trail. Receipts follow BIR formatting with 12% VAT and cash, GCash, and card tender.
              - generic [ref=e147]:
                - generic [ref=e148]: Engineering depth
                - paragraph [ref=e149]:
                  - text: Refunds use
                  - strong [ref=e150]: optimistic locking
                  - text: so double-refunds are impossible. Access is
                  - strong [ref=e151]: permission-based
                  - text: across four roles. CSRF protection on every write, session timeout, and Z-Read day-close. The schema has evolved across
                  - strong [ref=e152]: nine migrations
                  - text: as the store's needs grew, with PHPUnit tests on the core flows.
