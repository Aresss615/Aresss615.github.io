            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e186]
            - paragraph [ref=e187]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e188]:
              - generic [ref=e189]:
                - generic [ref=e190]: Problem
                - paragraph [ref=e191]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e192]:
                - generic [ref=e193]: Approach
                - paragraph [ref=e194]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
              - generic [ref=e195]:
                - generic [ref=e196]: Engineering depth
                - paragraph [ref=e197]:
