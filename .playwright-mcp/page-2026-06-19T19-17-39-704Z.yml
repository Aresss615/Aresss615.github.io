            - heading "MoneyPrinterTurbo — Extended" [level=3] [ref=e257]
            - paragraph [ref=e258]: An open-source TikTok / Shorts generator I forked and extended — turning a script into a finished, captioned vertical video, end to end.
            - generic [ref=e259]:
              - generic [ref=e260]:
                - generic [ref=e261]: Problem
                - paragraph [ref=e262]: The base project picked stock clips at random and leaned on a paid cloud voice. Captions were block-timed, so words never lit up in sync with the narration — the videos felt generic and the costs didn't scale.
              - generic [ref=e263]:
                - generic [ref=e264]: Approach
                - paragraph [ref=e265]:
                  - text: I forked
                  - strong [ref=e266]: MoneyPrinterTurbo
                  - text: and rebuilt three subsystems.
                  - strong [ref=e267]: Semantic clip matching
                  - text: embeds the script and ranks stock footage by meaning instead of random selection. Local
                  - strong [ref=e268]: Chatterbox TTS
                  - text: with voice cloning replaces paid Azure — no API cost, no rate limits. And captions highlight
                  - strong [ref=e269]: word-by-word
                  - text: ", lighting each word exactly as it's spoken."
              - generic [ref=e270]:
                - generic [ref=e271]: Engineering depth
                - paragraph [ref=e272]:
                  - text: Word-level highlighting is driven by
                  - strong [ref=e273]: WhisperX
                  - text: forced-alignment against the TTS audio, so subtitles track real word boundaries across wrapped, multi-line text. The render path runs on MoviePy with automatic CPU fallback when CUDA is unavailable — built to run on whatever machine is in front of you.
