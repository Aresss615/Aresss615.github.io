            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e132]
            - paragraph [ref=e133]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e134]:
              - generic [ref=e135]:
                - generic [ref=e136]: Problem
                - paragraph [ref=e137]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e138]:
                - generic [ref=e139]: Approach
                - paragraph [ref=e140]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
