            - heading "MoneyPrinterTurbo — Extended" [level=3] [ref=e203]
            - paragraph [ref=e204]: An open-source TikTok / Shorts generator I forked and extended — turning a script into a finished, captioned vertical video, end to end.
            - generic [ref=e205]:
              - generic [ref=e206]:
                - generic [ref=e207]: Problem
                - paragraph [ref=e208]: The base project picked stock clips at random and leaned on a paid cloud voice. Captions were block-timed, so words never lit up in sync with the narration — the videos felt generic and the costs didn't scale.
              - generic [ref=e209]:
                - generic [ref=e210]: Approach
                - paragraph [ref=e211]:
                  - text: I forked
                  - strong [ref=e212]: MoneyPrinterTurbo
                  - text: and rebuilt three subsystems.
                  - strong [ref=e213]: Semantic clip matching
                  - text: embeds the script and ranks stock footage by meaning instead of random selection. Local
                  - strong [ref=e214]: Chatterbox TTS
                  - text: with voice cloning replaces paid Azure — no API cost, no rate limits. And captions highlight
                  - strong [ref=e215]: word-by-word
                  - text: ", lighting each word exactly as it's spoken."
              - generic [ref=e216]:
                - generic [ref=e217]: Engineering depth
                - paragraph [ref=e218]:
                  - text: Word-level highlighting is driven by
                  - strong [ref=e219]: WhisperX
                  - text: forced-alignment against the TTS audio, so subtitles track real word boundaries across wrapped, multi-line text. The render path runs on MoviePy with automatic CPU fallback when CUDA is unavailable — built to run on whatever machine is in front of you.
