            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e221]
            - paragraph [ref=e222]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e223]:
              - generic [ref=e224]:
                - generic [ref=e225]: Problem
                - paragraph [ref=e226]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e227]:
                - generic [ref=e228]: Approach
                - paragraph [ref=e229]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
