            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e167]
            - paragraph [ref=e168]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e169]:
              - generic [ref=e170]:
                - generic [ref=e171]: Problem
                - paragraph [ref=e172]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e173]:
                - generic [ref=e174]: Approach
                - paragraph [ref=e175]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
