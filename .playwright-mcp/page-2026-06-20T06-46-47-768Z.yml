            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e181]
            - paragraph [ref=e182]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e183]:
              - generic [ref=e184]:
                - generic [ref=e185]: Problem
                - paragraph [ref=e186]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e187]:
                - generic [ref=e188]: Approach
                - paragraph [ref=e189]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
              - generic [ref=e190]:
                - generic [ref=e191]: Engineering depth
                - paragraph [ref=e192]:
                  - text: Overbooking is prevented at the database level — bookings commit inside a transaction using
                  - strong [ref=e193]: SELECT … FOR UPDATE
                  - text: ", so two customers can't grab the same slot. bcrypt + HttpOnly session cookies, role-based access, and KPI reporting."
