            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e224]
            - paragraph [ref=e225]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e226]:
              - generic [ref=e227]:
                - generic [ref=e228]: Problem
                - paragraph [ref=e229]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e230]:
                - generic [ref=e231]: Approach
                - paragraph [ref=e232]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
              - generic [ref=e233]:
                - generic [ref=e234]: Engineering depth
                - paragraph [ref=e235]:
                  - text: Overbooking is prevented at the database level — bookings commit inside a transaction using
                  - strong [ref=e236]: SELECT … FOR UPDATE
                  - text: ", so two customers can't grab the same slot. bcrypt + HttpOnly session cookies, role-based access, and KPI reporting."
