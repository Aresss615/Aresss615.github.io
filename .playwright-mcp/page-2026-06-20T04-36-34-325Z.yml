            - heading "MoneyPrinterTurbo — Extended" [level=3] [ref=e295]
            - paragraph [ref=e296]: An open-source TikTok / Shorts generator I forked and extended — turning a script into a finished, captioned vertical video, end to end.
            - generic [ref=e297]:
              - generic [ref=e298]:
                - generic [ref=e299]: Problem
                - paragraph [ref=e300]: The base project picked stock clips at random and leaned on a paid cloud voice. Captions were block-timed, so words never lit up in sync with the narration — the videos felt generic and the costs didn't scale.
              - generic [ref=e301]:
                - generic [ref=e302]: Approach
                - paragraph [ref=e303]:
                  - text: I forked
                  - strong [ref=e304]: MoneyPrinterTurbo
                  - text: and rebuilt three subsystems.
                  - strong [ref=e305]: Semantic clip matching
                  - text: embeds the script and ranks stock footage by meaning instead of random selection. Local
                  - strong [ref=e306]: Chatterbox TTS
                  - text: with voice cloning replaces paid Azure — no API cost, no rate limits. And captions highlight
                  - strong [ref=e307]: word-by-word
                  - text: ", lighting each word exactly as it's spoken."
              - generic [ref=e308]:
                - generic [ref=e309]: Engineering depth
                - paragraph [ref=e310]:
                  - text: Word-level highlighting is driven by
                  - strong [ref=e311]: WhisperX
                  - text: forced-alignment against the TTS audio, so subtitles track real word boundaries across wrapped, multi-line text. The render path runs on MoviePy with automatic CPU fallback when CUDA is unavailable — built to run on whatever machine is in front of you.
            - generic [ref=e312]:
