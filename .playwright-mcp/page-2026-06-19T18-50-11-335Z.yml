            - heading "MoneyPrinterTurbo — Extended" [level=3] [ref=e275]
            - paragraph [ref=e276]: An open-source TikTok / Shorts generator I forked and extended — turning a script into a finished, captioned vertical video, end to end.
            - generic [ref=e277]:
              - generic [ref=e278]:
                - generic [ref=e279]: Problem
                - paragraph [ref=e280]: The base project picked stock clips at random and leaned on a paid cloud voice. Captions were block-timed, so words never lit up in sync with the narration — the videos felt generic and the costs didn't scale.
              - generic [ref=e281]:
                - generic [ref=e282]: Approach
                - paragraph [ref=e283]:
                  - text: I forked
                  - strong [ref=e284]: MoneyPrinterTurbo
                  - text: and rebuilt three subsystems.
                  - strong [ref=e285]: Semantic clip matching
                  - text: embeds the script and ranks stock footage by meaning instead of random selection. Local
                  - strong [ref=e286]: Chatterbox TTS
                  - text: with voice cloning replaces paid Azure — no API cost, no rate limits. And captions highlight
                  - strong [ref=e287]: word-by-word
                  - text: ", lighting each word exactly as it's spoken."
              - generic [ref=e288]:
                - generic [ref=e289]: Engineering depth
                - paragraph [ref=e290]:
                  - text: Word-level highlighting is driven by
                  - strong [ref=e291]: WhisperX
                  - text: forced-alignment against the TTS audio, so subtitles track real word boundaries across wrapped, multi-line text. The render path runs on MoviePy with automatic CPU fallback when CUDA is unavailable — built to run on whatever machine is in front of you.
            - generic [ref=e292]:
