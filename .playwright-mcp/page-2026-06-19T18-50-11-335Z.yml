            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e204]
            - paragraph [ref=e205]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e206]:
              - generic [ref=e207]:
                - generic [ref=e208]: Problem
                - paragraph [ref=e209]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e210]:
                - generic [ref=e211]: Approach
                - paragraph [ref=e212]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
              - generic [ref=e213]:
                - generic [ref=e214]: Engineering depth
                - paragraph [ref=e215]:
                  - text: Overbooking is prevented at the database level — bookings commit inside a transaction using
                  - strong [ref=e216]: SELECT … FOR UPDATE
                  - text: ", so two customers can't grab the same slot. bcrypt + HttpOnly session cookies, role-based access, and KPI reporting."
