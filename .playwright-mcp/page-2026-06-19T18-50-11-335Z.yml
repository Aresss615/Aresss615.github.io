            - heading "J&J Grocery POS" [level=3] [ref=e125]
            - paragraph [ref=e126]: A complete point-of-sale and inventory system running the day-to-day of a real Philippine grocery store.
            - generic [ref=e127]:
              - generic [ref=e128]:
                - generic [ref=e129]: Problem
                - paragraph [ref=e130]: The store ran sales and stock by hand — slow checkout, no audit trail, and no reliable view of what was selling or what was left on the shelf.
              - generic [ref=e131]:
                - generic [ref=e132]: Approach
                - paragraph [ref=e133]:
                  - text: Vanilla PHP + MySQL, no framework — so it deploys on any cheap PHP host the store can actually afford. Barcode checkout auto-decrements stock; every sale, void, and refund posts to a
                  - strong [ref=e134]: double-entry accounting journal
                  - text: and an immutable audit trail. Receipts follow BIR formatting with 12% VAT and cash, GCash, and card tender.
              - generic [ref=e135]:
                - generic [ref=e136]: Engineering depth
                - paragraph [ref=e137]:
                  - text: Refunds use
                  - strong [ref=e138]: optimistic locking
                  - text: so double-refunds are impossible. Access is
                  - strong [ref=e139]: permission-based
                  - text: across four roles. CSRF protection on every write, session timeout, and Z-Read day-close. The schema has evolved across
                  - strong [ref=e140]: nine migrations
                  - text: as the store's needs grew, with PHPUnit tests on the core flows.
            - generic [ref=e141]:
