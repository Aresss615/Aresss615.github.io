            - paragraph [ref=e201]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e202]:
              - generic [ref=e203]:
                - generic [ref=e204]: Problem
                - paragraph [ref=e205]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e206]:
                - generic [ref=e207]: Approach
