      - generic [ref=e78]:
        - paragraph [ref=e79]:
          - text: Computer engineering sits between two worlds — the
          - emphasis [ref=e80]: logic of software
          - text: and the
          - emphasis [ref=e81]: constraints of hardware.
          - text: "I work across both, and I care about one thing above all: systems that hold up in production, not just in a demo."
        - generic [ref=e82]:
          - paragraph [ref=e83]: I'm a third-year BS Computer Engineering student at Mariano Marcos State University – Batac. I've built and now maintain a point-of-sale system that runs a working grocery business, shipped a configurable reservation platform, and written software from JavaFX desktop apps to React/TypeScript tools.
          - paragraph [ref=e84]: Before the code, I did real IT work — keeping store hardware and networks alive, maintaining municipal databases, and standing up backup routines for a local government unit. That ground-level experience is why I design for the messy real world, not the happy path.
          - generic [ref=e85]:
            - generic [ref=e86]: — J. C. Delos Santos
            - generic [ref=e87]: Ilocos Norte · 18.03°N, 120.57°E
