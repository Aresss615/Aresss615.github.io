        - heading "Systems I designed, built, and still maintain." [level=2] [ref=e92]:
          - text: Systems I designed,
          - text: built, and still maintain.
        - paragraph [ref=e93]: Three are sole-engineer builds. Every one solves a real problem for real users — no class assignments dressed up as products.
