            - heading "BookmeIN — Reservation Platform" [level=3] [ref=e179]
            - paragraph [ref=e180]: One booking codebase that reskins itself for hotels, restaurants, clinics, or salons.
            - generic [ref=e181]:
              - generic [ref=e182]:
                - generic [ref=e183]: Problem
                - paragraph [ref=e184]: Small service businesses all need the same engine — take bookings, never double-book — but with different vocabulary and fields.
              - generic [ref=e185]:
                - generic [ref=e186]: Approach
                - paragraph [ref=e187]: A business-type preset drives dynamic labels and booking fields, so one install becomes a hotel-room booker or a dental scheduler by flipping a setting. Vanilla PHP API behind a single-file JS SPA — no build step.
              - generic [ref=e188]:
                - generic [ref=e189]: Engineering depth
                - paragraph [ref=e190]:
                  - text: Overbooking is prevented at the database level — bookings commit inside a transaction using
                  - strong [ref=e191]: SELECT … FOR UPDATE
                  - text: ", so two customers can't grab the same slot. bcrypt + HttpOnly session cookies, role-based access, and KPI reporting."
