            - heading "J&J Grocery POS" [level=3] [ref=e100]
            - paragraph [ref=e101]: A complete point-of-sale and inventory system running the day-to-day of a real Philippine grocery store.
            - generic [ref=e102]:
              - generic [ref=e103]:
                - generic [ref=e104]: Problem
                - paragraph [ref=e105]: The store ran sales and stock by hand — slow checkout, no audit trail, and no reliable view of what was selling or what was left on the shelf.
              - generic [ref=e106]:
                - generic [ref=e107]: Approach
                - paragraph [ref=e108]:
                  - text: Vanilla PHP + MySQL, no framework — so it deploys on any cheap PHP host the store can actually afford. Barcode checkout auto-decrements stock; every sale, void, and refund posts to a
                  - strong [ref=e109]: double-entry accounting journal
                  - text: and an immutable audit trail. Receipts follow BIR formatting with 12% VAT and cash, GCash, and card tender.
              - generic [ref=e110]:
                - generic [ref=e111]: Engineering depth
                - paragraph [ref=e112]:
                  - text: Refunds use
                  - strong [ref=e113]: optimistic locking
                  - text: so double-refunds are impossible. Access is
                  - strong [ref=e114]: permission-based
                  - text: across four roles. CSRF protection on every write, session timeout, and Z-Read day-close. The schema has evolved across
                  - strong [ref=e115]: nine migrations
                  - text: as the store's needs grew, with PHPUnit tests on the core flows.
